<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entre Amigos</title>
<style>
:root{color-scheme:dark;--bg:#0d0b10;--fg:#f2ece4;--ac:#ffcc4d;--bad:#ff5a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#fs{position:absolute;top:8px;right:10px;z-index:5;width:34px;height:34px;border-radius:8px;border:1px solid #fff4;background:#000a;color:#fff;font-size:18px;cursor:pointer;padding:0}
#wrap{position:relative;flex:none;width:min(100vw,160vh);width:min(100vw,160dvh);aspect-ratio:8/5;overflow:hidden;user-select:none}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;pointer-events:none}
#stats{bottom:20px;left:12px;font-size:14px;line-height:1.5;text-shadow:0 1px 3px #000}
#cross{top:50%;left:50%;width:10px;height:10px;margin:-5px;border:1px solid #fff8;border-radius:50%}
#input{bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#input b{width:46px;height:58px;border:2px solid #fff6;border-radius:8px;background:#000a;display:grid;place-items:center;font:700 30px ui-monospace,monospace;color:var(--ac)}
#input.bad b{border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#toast{top:16%;width:100%;text-align:center;font-size:22px;font-weight:700;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s}
#cover{position:absolute;inset:0;background:#000c;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer}
#cover h1{margin:0 0 8px;font-size:34px;color:var(--ac)}
#cover p{margin:6px auto;max-width:520px;line-height:1.5;color:#e6dfd6}
#dk{margin-bottom:.45em}#dn{font-size:.45em;letter-spacing:.08em;text-transform:uppercase;color:#ddd}#dn b{display:block;font-size:2.4em;letter-spacing:0;color:var(--ac);margin-top:.1em}
#dead{position:absolute;inset:0;z-index:4;background:#000;display:none;place-items:center;font-size:clamp(28px,6vw,64px);font-weight:800;letter-spacing:.04em;text-align:center;color:#fff}
#top{top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:max(40%,calc(100% - 440px));font-size:13px}
#keys{top:8px;left:12px;font-size:12px;line-height:1.55;background:#000a;border:1px solid #fff3;border-radius:8px;padding:6px 10px;max-width:190px;text-shadow:0 1px 2px #000}
#keys b{color:var(--ac)}
#score{top:8px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
#score .st{font-size:13px;font-weight:700;color:#f3e6c8;text-shadow:0 1px 3px #000;margin-bottom:4px}
#score .sr{display:flex;gap:10px;justify-content:center;align-items:flex-start}
#score .sb{min-width:62px}
#score .sb b{display:block;background:#f3e6c8;color:#3a2f22;border-radius:8px;font-size:26px;line-height:44px;height:44px;padding:0 10px;box-shadow:0 2px 6px #0008}
#score .sb.me b{outline:2px solid var(--ac)}
#score .sb span{display:block;font-size:11px;color:#f3e6c8;margin-top:2px;text-shadow:0 1px 2px #000}
#score em{font-style:normal;color:#f3e6c8;font-size:22px;line-height:44px}
#mini{left:12px;bottom:56px;width:100px;height:100px;border:2px solid var(--ac);border-radius:6px;background:#000c;display:none}
#top div{background:#000a;border-radius:8px;padding:4px 10px;min-width:92px;border:1px solid #fff3}
#top .me{border-color:var(--ac)}
#top i{display:block;height:3px;background:var(--ac);margin-top:3px;border-radius:2px}
#goal{top:104px;width:100%;text-align:center;font-size:12px;color:#ddd;text-shadow:0 1px 3px #000}
.card{background:#1b1722;border:1px solid #fff3;border-radius:14px;padding:22px;max-width:440px;width:100%;box-sizing:border-box}
.card p{line-height:1.5;color:#e6dfd6}
.card input[type=text]{width:80%;padding:10px;font-size:18px;border-radius:8px;border:1px solid #fff4;background:#0d0b10;color:var(--fg);text-align:center}
.card select{width:80%;padding:10px;font-size:17px;border-radius:8px;border:1px solid #fff4;background:#0d0b10;color:var(--fg);text-align:center;cursor:pointer}
.card option:disabled{color:#777}
#chimg{display:none;width:72px;height:72px;object-fit:cover;border:2px solid var(--ac);border-radius:8px;margin:10px auto 0}
#err{color:var(--bad);min-height:18px;font-size:14px;margin-top:8px}
.card button{margin-top:14px;padding:10px 22px;font-size:17px;font-weight:700;border:0;border-radius:8px;background:var(--ac);color:#1a1200;cursor:pointer}
#photo{position:absolute;right:10px;bottom:90px;width:200px;height:auto;border:3px solid #fff;border-radius:6px;display:none;box-shadow:0 4px 14px #000a;pointer-events:none;background:#000}
#photo.big{width:68%;left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%)}
#plist{list-style:none;padding:0;margin:12px 0;text-align:left;max-height:150px;overflow:auto}
#plist li{padding:5px 10px;border-bottom:1px solid #fff2}
html,body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,select{-webkit-user-select:text;user-select:text}
#wrap{touch-action:none}
#cover{display:flex;overflow:auto;align-items:flex-start;cursor:default}
.card{margin:auto}
.card h2.h{margin:0 0 8px;color:var(--ac)}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card .row.col{flex-direction:column;align-items:center}
.card button.big{font-size:22px;padding:14px 34px;min-width:230px}
.card button.sec{background:#3a3346;color:#f2ece4}
.card button:disabled{opacity:.5}
.logo{font-size:46px;letter-spacing:.05em;color:var(--ac);font-weight:900;line-height:1.05;text-shadow:0 3px 0 #7a5a00,0 7px 20px #000}
.credit{font-size:11px;color:#9a93a3;margin-top:18px;letter-spacing:.04em}
.srv{display:flex;justify-content:space-between;gap:10px;background:#0d0b10;border:1px solid #fff3;border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;text-align:left;font-size:15px}
.srv:hover{border-color:var(--ac)}
#tc{position:absolute;inset:0;pointer-events:none;display:none;z-index:3}
#tc>*{pointer-events:auto}
#joy{position:absolute;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:#fff1;border:2px solid #fff4;touch-action:none}
#joyk{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#ffcc4dcc;box-shadow:0 2px 8px #0008;pointer-events:none}
.tb{position:absolute;border-radius:50%;border:2px solid #fff6;background:#000a;color:#fff;font-size:24px;display:grid;place-items:center;padding:0;touch-action:none;cursor:pointer}
.tb.on{background:#ffcc4dcc;color:#1a1200}
#bPunch{right:20px;bottom:20px;width:80px;height:80px;font-size:36px}
#bJump{right:112px;bottom:26px;width:58px;height:58px}
#bCrouch{right:28px;bottom:112px;width:52px;height:52px}
#bPadBtn{right:92px;bottom:112px;width:52px;height:52px;font-size:20px}
#bPhoto{right:156px;bottom:96px;width:52px;height:52px}
#bView{right:156px;bottom:154px;width:52px;height:52px}
#pad{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);display:none;grid-template-columns:repeat(6,44px);gap:6px;background:#000c;padding:8px;border-radius:12px;border:1px solid #fff3}
#pad button{height:44px;border-radius:8px;border:1px solid #fff4;background:#2a2433;color:#fff;font:700 20px ui-monospace,monospace;padding:0;touch-action:none}
#rot{position:fixed;inset:0;z-index:50;background:#0d0b10;display:none;place-items:center;text-align:center;font-size:20px;padding:30px;line-height:1.4}
@media (orientation:portrait){body.mob #rot{display:grid}}
body.mob #stats{bottom:auto;top:64px;left:12px;font-size:12px}
body.mob #mini{left:auto;right:56px;top:8px;bottom:auto;width:84px;height:84px}
body.mob #score .st{font-size:11px;margin-bottom:2px}
body.mob #score .sb b{font-size:20px;line-height:34px;height:34px}
body.mob #input{pointer-events:auto;bottom:10px;gap:6px}
body.mob #input b{width:36px;height:44px;font-size:24px}
body.mob #toast{top:22%;font-size:17px}
body.mob #goal{top:84px}
body.mob #photo:not(.big){width:130px;bottom:auto;top:70px;right:10px}
body.mob #keys{display:none}
@media (max-height:480px){.card{padding:12px}.card p{margin:4px 0;font-size:13px}.logo{font-size:34px}.card button.big{font-size:18px;padding:10px 24px}.credit{margin-top:10px}#cover{padding:8px}}
#lp{position:absolute;left:10px;top:10px;z-index:3;width:min(250px,42%);display:none;background:#1b1722ee;border:1px solid #fff3;border-radius:12px;padding:12px;box-sizing:border-box;font-size:14px;max-height:calc(100% - 20px);overflow:auto;text-align:center}
#lp h2{margin:0 0 4px;font-size:18px;color:var(--ac)}
#lp .code{font:700 22px ui-monospace,monospace;letter-spacing:.2em;color:var(--ac)}
#lp ul{list-style:none;padding:0;margin:8px 0;text-align:left}
#lp li{padding:4px 6px;border-bottom:1px solid #fff2}
#lp button{margin-top:8px;padding:9px 14px;font-size:15px;font-weight:700;border:0;border-radius:8px;background:var(--ac);color:#1a1200;cursor:pointer;width:100%}
#lp button.sec{background:#3a3346;color:#f2ece4}
#lp small{color:#aaa;display:block;line-height:1.4;margin-top:6px}
#lp .wait{margin:8px 0;color:#ddd}
body.mob #lp{width:200px;font-size:12px;padding:8px;max-height:calc(100% - 160px)}
body.mob #lp small.help{display:none}
</style></head><body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud" id="stats"></div>
  <div class="hud" id="cross"></div>
  <canvas id="photo" width="800" height="500"></canvas><div class="hud" id="flash" style="inset:0;background:#fff;opacity:0"></div>

  <div class="hud" id="input"><b></b><b></b><b></b><b></b></div>

</div>
<div id="rot">📱<br>Girá el celular en horizontal<br>para jugar</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const W=800,H=500,cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const $=id=>document.getElementById(id);
// ---------- mapa: casa grande ----------
// tipos: 0 piso, 9 pasto, 1 pared, 3 rojo, 4 verde, 5 azul, 6 seto, 8 marmol, 10/11 escalera sube/baja, 12 mueble (solido, se dibuja como objeto)
const MW=18,MH=16,mk=()=>Array.from({length:MH},()=>new Array(MW).fill(0));
const MAPS=[mk(),mk(),mk()],[G,U,LBY]=MAPS,DECO=[[],[],[]],RUGS=[[],[],[]];
const WC={1:[205,178,146],3:[150,52,58],4:[62,118,82],5:[62,88,142],6:[40,112,46],8:[222,222,228],10:[190,140,80],11:[90,120,150]};
const fill=(m,x0,y0,x1,y1,v)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)m[y][x]=v};
const wv=(m,x,a,b,t,g=[])=>{for(let y=a;y<=b;y++)if(!g.includes(y))m[y][x]=t},wh=(m,y,a,b,t,g=[])=>{for(let x=a;x<=b;x++)if(!g.includes(x))m[y][x]=t};

const dec=(f,k,l)=>l.forEach(([x,y])=>{MAPS[f][y][x]=12;DECO[f].push({rx:x+.5,ry:y+.5,deco:k,f,alive:true})});
const rug=(f,s,x0,y0,x1,y1)=>RUGS[f].push({s,x0,y0,x1,y1});
// planta baja: mansion (x 0-17) + jardin (x 18-24)
wh(G,0,0,17,1);wh(G,15,0,17,1);wv(G,0,0,15,1);wv(G,17,0,15,1);
wv(G,5,1,14,3,[3,4,11,12]);wv(G,12,1,14,4,[3,4,11,12]);wh(G,7,1,4,3,[2]);wh(G,7,13,16,4,[15]);wh(G,10,6,11,5,[8,9]);
put(G,[[7,5],[10,5]],8);
dec(0,'shelf',[[1,1],[2,1],[3,1]]);dec(0,'chair',[[1,5],[7,12],[10,12],[7,13],[10,13],[14,12],[15,12]]);
dec(0,'lamp',[[4,6],[1,9],[6,9],[11,9]]);dec(0,'bed',[[2,13]]);dec(0,'plant',[[4,14],[6,1],[11,1],[16,1],[16,14]]);
dec(0,'sofa',[[14,1],[15,1]]);dec(0,'table',[[14,4],[8,12],[9,12],[8,13],[9,13],[14,11],[15,11]]);
rug(0,0,2,3,4,6);rug(0,1,2,10,4,13);rug(0,2,13,3,16,6);rug(0,1,7,11,11,14);rug(0,0,7,2,10,9);
// ---------- SALA DE ESPERA del servidor: 10 x 10 casilleros (1 casillero = 1 metro), piso 2 aparte de la casa ----------
wh(LBY,0,0,11,1);wh(LBY,11,0,11,1);wv(LBY,0,0,11,1);wv(LBY,11,0,11,1);
dec(2,'shelf',[[2,1],[3,1],[8,1],[9,1]]);dec(2,'plant',[[1,1],[10,1],[1,10],[10,10]]);dec(2,'lamp',[[1,5],[1,6],[10,5],[10,6]]);
dec(2,'sofa',[[4,10],[5,10],[6,10],[7,10]]);dec(2,'table',[[5,5],[6,5],[5,6],[6,6]]);dec(2,'chair',[[4,5],[4,6],[7,5],[7,6]]);
rug(2,0,3,3,9,9);
// ---------- detalles: paredes, alfombras, muebles ----------
const sh=(c,f,m=1)=>`rgb(${c[0]*f*m|0},${c[1]*f*m|0},${c[2]*f*m|0})`;
const PAINT=[[[127,178,229],[76,138,60]],[[224,168,95],[122,74,44]],[[184,201,214],[58,74,102]],[[200,107,107],[235,216,166]],[[107,74,138],[224,176,96]]];
function wallCol(i,r,lh,col,f){const y0=H/2-lh/2+(EYE-.5)*lh;
 if(r.t>=10){const n=8,up=r.t===10;for(let k=0;k<n;k++){const m=up?.6+.55*k/n:1.1-.5*k/n;ctx.fillStyle=sh(col,f,k%2?m:m*.8);ctx.fillRect(i,y0+lh*k/n,1,lh/n+1)}
  ctx.fillStyle=sh([110,70,35],f);ctx.fillRect(i,y0,1,Math.max(1,lh*.07));return}
 ctx.fillStyle=sh(col,f);ctx.fillRect(i,y0,1,lh+1);if(r.t===8||r.t===6)return;
 ctx.fillStyle=sh(col,f,.6);ctx.fillRect(i,y0+lh*.68,1,lh*.32+1);
 ctx.fillStyle=sh(col,f,1.25);ctx.fillRect(i,y0+lh*.66,1,Math.max(1,lh*.025));
 ctx.fillStyle=sh(col,f,.78);ctx.fillRect(i,y0,1,Math.max(1,lh*.05));
 const hs=(r.mx*7+r.my*13+(r.side?3:0))%6,w=r.wx,y1=y0+lh*.2,y2=y0+lh*.55,gold=[205,160,60];
 if(hs<2&&w>.22&&w<.78){if(w<.27||w>.73){ctx.fillStyle=sh(gold,f);ctx.fillRect(i,y1-lh*.03,1,y2-y1+lh*.06)}
  else{ctx.fillStyle=sh(gold,f);ctx.fillRect(i,y1-lh*.03,1,lh*.03);ctx.fillRect(i,y2,1,lh*.03);const p=PAINT[(r.mx+r.my)%5],ym=y1+(y2-y1)*.6;
   ctx.fillStyle=sh(p[0],f);ctx.fillRect(i,y1,1,ym-y1);ctx.fillStyle=sh(p[1],f);ctx.fillRect(i,ym,1,y2-ym);
   if(w>.47&&w<.53){ctx.fillStyle=sh(p[1],f,.6);ctx.fillRect(i,y1+(y2-y1)*.25,1,(y2-y1)*.5)}}}
 else if(hs===2&&r.t===1&&w>.3&&w<.7){const a=y0+lh*.16,b=y0+lh*.6,fr=w<.34||w>.66||(w>.48&&w<.52);
  ctx.fillStyle=fr?sh([238,232,222],f):sh([150,205,240],Math.max(f,.7));ctx.fillRect(i,a,1,b-a);
  if(!fr){ctx.fillStyle=sh([238,232,222],f);ctx.fillRect(i,(a+b)/2,1,Math.max(1,lh*.02))}}}
const RC=[[[150,40,48],[205,170,80]],[[50,80,140],[220,200,150]],[[50,110,70],[210,190,120]],[[135,135,128],[108,108,102]]];
function drawRugs(){for(const r of RUGS[P.f]){const st=RC[r.s];
 for(let x=r.x0;x<r.x1;x++)for(let y=r.y0;y<r.y1;y++){
  const q=[[x,y],[x+1,y],[x+1,y+1],[x,y+1]].map(([a,b])=>proj({rx:a,ry:b}));if(q.some(p=>p.ty<.15))continue;
  const edge=r.s<3&&(x===r.x0||y===r.y0||x===r.x1-1||y===r.y1-1),c=edge?st[1]:st[0],fg=1/(1+q[0].ty*.14)*((x+y)%2?.9:1);
  ctx.fillStyle=ctx.strokeStyle=`rgb(${c[0]*fg|0},${c[1]*fg|0},${c[2]*fg|0})`;ctx.beginPath();
  q.forEach((p,k)=>{const yy=H/2+H/p.ty*EYE;k?ctx.lineTo(p.scr,yy):ctx.moveTo(p.scr,yy)});ctx.closePath();ctx.fill();ctx.stroke()}}}
const DW={star:.5,cam:.55,sofa:1,chair:.55,table:.85,plant:.5,lamp:.4,bed:1,shelf:.85,tree:1.1,fountain:1.05,map:.5,beam:.9};
function drawDeco(e,cx,cy,h,w){const fy=cy+h/2,k=e.deco;ctx.filter='brightness('+(1/(1+H/h*.09)).toFixed(2)+')';
 const R=(x,y,a,b,c)=>{ctx.fillStyle=c;ctx.fillRect(cx+x*h,fy-(y+b)*h,a*h,b*h)},
 C=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx+x*h,fy-y*h,r*h,0,7);ctx.fill()},
 E=(x,y,a,b,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(cx+x*h,fy-y*h,a*h,b*h,0,0,7);ctx.fill()};
 if(k==='beam'){drawBeam(e,cx,fy,h);return}
 E(0,0,.42,.05,'rgba(0,0,0,.35)');
 if(k==='sofa'){R(-.48,0,.96,.28,'#7a3b3b');R(-.48,.2,.96,.32,'#8d4646');R(-.5,0,.1,.38,'#6a3030');R(.4,0,.1,.38,'#6a3030');R(-.36,.18,.34,.12,'#a05656');R(.02,.18,.34,.12,'#a05656')}
 else if(k==='chair'){R(-.25,0,.5,.22,'#3f5f8a');R(-.25,.14,.5,.34,'#4a6fa0');R(-.28,0,.07,.3,'#34507a');R(.21,0,.07,.3,'#34507a')}
 else if(k==='table'){R(-.4,.3,.8,.07,'#8a5a32');R(-.38,0,.06,.3,'#5a3b20');R(.32,0,.06,.3,'#5a3b20')}
 else if(k==='plant'){R(-.12,0,.24,.18,'#a0522d');C(0,.42,.2,'#2e7d32');C(-.13,.3,.14,'#3a9140');C(.13,.3,.14,'#2a6e2e')}
 else if(k==='lamp'){R(-.02,0,.04,.62,'#555');R(-.09,0,.18,.03,'#444');C(0,.68,.22,'rgba(255,220,120,.2)');R(-.12,.6,.24,.14,'#f3d27a')}
 else if(k==='bed'){R(-.47,0,.06,.45,'#4a2f18');R(-.45,0,.9,.22,'#6b4a2a');R(-.42,.2,.84,.1,'#e8e2d6');R(-.3,.28,.72,.05,'#a8c4e0');R(-.4,.3,.26,.07,'#fff')}

function mkRoom(peer,isHost){const L={},conns=new Map(),pres=new Map(),pcb=[],ccb=[];let hc=null,dirty=false,iv=0,closed=false;
 const fire=(t,m)=>(L[t]||[]).forEach(f=>{try{f(m)}catch(e){console.error(e)}});
 const emitPeers=snap=>{const me=peer.id,peers=snap.map(([id,p])=>({peer:id,isMe:id===me,sameTab:id===me,kind:'viewer',presence:p}));pcb.forEach(f=>{try{f({peers})}catch(e){console.error(e)}})};
 const bcast=m=>conns.forEach(c=>{if(c.open)try{c.send(m)}catch{}});
 const lost=why=>{if(closed)return;closed=true;clearInterval(iv);ccb.forEach(f=>f(why))};
 const r={isHost,
  onPeers:f=>pcb.push(f),on:(t,f)=>(L[t]=L[t]||[]).push(f),onClose:f=>ccb.push(f),
  emit:(t,d)=>{if(isHost)bcast({t:'ev',type:t,data:d,from:peer.id});else if(hc&&hc.open)hc.send({t:'ev',type:t,data:d});return Promise.resolve()},
  presence:p=>{if(isHost){pres.set(peer.id,p);dirty=true}else if(hc&&hc.open)hc.send({t:'pres',p});return Promise.resolve()},
  leave:()=>{closed=true;clearInterval(iv);try{peer.destroy()}catch{}},
  _host(){peer.on('connection',conn=>{
    conn.on('open',()=>{if(conns.size>=MAXP-1){try{conn.send({t:'full'})}catch{}setTimeout(()=>conn.close(),500);return}conns.set(conn.peer,conn);dirty=true});
    conn.on('data',m=>{if(!m||conns.get(conn.peer)!==conn)return;
     if(m.t==='pres'){pres.set(conn.peer,m.p);dirty=true}
     else if(m.t==='ev'){fire(m.type,{data:m.data,isMe:false,peer:conn.peer});conns.forEach((c,id)=>{if(id!==conn.peer&&c.open)try{c.send({t:'ev',type:m.type,data:m.data,from:conn.peer})}catch{}})}});
    const gone=()=>{if(conns.get(conn.peer)===conn){conns.delete(conn.peer);pres.delete(conn.peer);dirty=true}};
    conn.on('close',gone);conn.on('error',gone)});
   peer.on('disconnected',()=>{try{peer.reconnect()}catch{}});
   iv=setInterval(()=>{if(!dirty)return;dirty=false;const s=[...pres.entries()];bcast({t:'peers',list:s});emitPeers(s)},100)},
  _client(conn){hc=conn;conn.on('data',m=>{if(!m)return;if(m.t==='peers')emitPeers(m.list);else if(m.t==='ev')fire(m.type,{data:m.data,isMe:false,peer:m.from});else if(m.t==='full')lost('El servidor está lleno (máximo '+MAXP+' jugadores).')});
   conn.on('close',()=>lost('Se perdió la conexión con el servidor.'));conn.on('error',()=>lost('Se perdió la conexión con el servidor.'))}};
 return r}
function netCreate(code){return new Promise((res,rej)=>{if(!window.Peer)return rej('No se pudo cargar la red. Revisá tu conexión a internet.');
 let ok=false;const peer=new Peer(PFX+code),t=setTimeout(()=>{if(!ok){try{peer.destroy()}catch{}rej('No se pudo conectar con el servicio de red.')}},12000);
 peer.on('open',()=>{ok=true;clearTimeout(t);const r=mkRoom(peer,true);r._host();res(r)});
 peer.on('error',e=>{if(ok)return;clearTimeout(t);try{peer.destroy()}catch{}rej(e.type==='unavailable-id'?'Ese código ya está en uso. Probá con otro.':'Error de red ('+e.type+')')})})}
function netJoin(code){return new Promise((res,rej)=>{if(!window.Peer)return rej('No se pudo cargar la red. Revisá tu conexión a internet.');
 let ok=false;const peer=new Peer(),fail=m=>{if(ok)return;ok=true;clearTimeout(t);try{peer.destroy()}catch{}rej(m)},t=setTimeout(()=>{ok=false;fail('No se encontró el servidor. Revisá el código.')},12000);
 peer.on('error',e=>fail(e.type==='peer-unavailable'?'No existe un servidor con ese código.':'Error de red ('+e.type+')'));
 peer.on('open',()=>{const conn=peer.connect(PFX+code,{reliable:true});
  conn.on('open',()=>{if(ok)return;ok=true;clearTimeout(t);const r=mkRoom(peer,false);r._client(conn);res(r)})})})}

 r.on('pick',m=>{if(m.isMe)return;const d=m.data||{},it=ITEMS.find(i=>i.id===d.id);if(!it)return;if(it.deco!=='map'){const k=others.get(m.peer);if(k)actSound(k,'CLINK')}if(it.deco==='cam'){it.alive=false;clearTimeout(itemT[it.id])}else moveItem(d.id,+d.nx,+d.ny,d.nf|0,60000)});

 clearInterval(presIv);

 if(phase==='lobby'){const help=MOB?'Joystick izquierdo: moverte · arrastrá en la pantalla: girar<br>👊 piña · ⬆ saltar · ⇩ agacharse · 🔢 teclado para escribir el cartelito<br>📷 foto (si tenés la cámara)':'W A S D mover · mouse o ← → girar · 0–9 escribir · Backspace borrar<br>Espacio saltar (¡podés subirte a los sillones!) · C agacharse · Shift correr<br>G o clic: piña 👊 (deja ciego 5 s) · F foto · V ver foto';
  c.innerHTML='<h2 class="h" style="font-size:22px">Sala de espera</h2>'+(SRVCODE?'<p style="margin:0">Servidor · código <b style="color:#ffcc4d;font-size:24px;letter-spacing:.2em">'+SRVCODE+'</b></p>':'<p style="margin:0">Modo bots (solo)</p>')+'<ul id="plist"></ul><label>¿Cuántos bots querés? <input type="number" id="bt" min="0" value="'+useBots+'" style="width:64px;padding:6px;border-radius:6px;border:1px solid #fff4;background:#0d0b10;color:inherit;text-align:center"></label><br><small id="bmax" style="color:#aaa"></small><div class="row">'+B('st','')+B('lv','Salir','sec')+'</div><p style="font-size:13px;color:#aaa">'+help+'</p>';
  $('bt').onchange=e=>{useBots=Math.max(0,Math.min(maxBots(),parseInt(e.target.value)||0));e.target.value=useBots};
  $('st').onclick=doStart;
  $('lv').onclick=leaveToMenu;
  drawLobby();return}
 if(phase==='over'){c.innerHTML='<h2 class="h">🏆 ¡Ganó <span id="wn"></span>!</h2>'+B('bk','Volver a la sala');$('wn').textContent=winner;$('bk').onclick=enterLobby}}
var SRVCODE=null;
$('fs').onmousedown=e=>e.preventDefault();$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})};
renderCard();
