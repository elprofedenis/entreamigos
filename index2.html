<style>

#sabm{z-index:3;left:0;right:0;top:30%;text-align:center;font-size:clamp(15px,2.6vw,28px);font-weight:900;color:#ffe9b0;text-shadow:0 2px 10px #000,0 0 22px #ff5a3d;padding:0 16px;line-height:1.3;display:none}#sabm small{display:block;font-size:.55em;font-weight:600;color:#ddd}
#dk{margin-bottom:.45em}#dn{font-size:.45em;letter-spacing:.08em;text-transform:uppercase;color:#ddd}#dn b{font-family:BebasKai,system-ui,sans-serif;font-weight:400;display:block;font-size:2.4em;letter-spacing:0;color:var(--ac);margin-top:.1em}

#top{top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:max(40%,calc(100% - 440px));font-size:13px}
#keys{top:8px;left:12px;font-size:12px;line-height:1.55;background:#000a;border:1px solid #fff3;border-radius:8px;padding:6px 10px;max-width:190px;text-shadow:0 1px 2px #000}

#score{top:8px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
#score .st{font-size:13px;font-weight:700;color:#f3e6c8;text-shadow:0 1px 3px #000;margin-bottom:4px}

#score em{font-style:normal;color:#f3e6c8;font-size:22px;line-height:44px}
#mini{left:12px;bottom:56px;width:100px;height:100px;border:2px solid var(--ac);border-radius:6px;background:#000c;display:none}
#top div{background:#000a;border-radius:8px;padding:4px 10px;min-width:92px;border:1px solid #fff3}
#top .me{border-color:var(--ac)}
#top i{display:block;height:3px;background:var(--ac);margin-top:3px;border-radius:2px}
#goal{top:104px;width:100%;text-align:center;font-size:12px;color:#ddd;text-shadow:0 1px 3px #000}

.card p{line-height:1.5;color:#e6dfd6}

#chimg{display:none;width:72px;height:72px;object-fit:cover;border:2px solid var(--ac);border-radius:8px;margin:10px auto 0}
#err{color:var(--bad);min-height:18px;font-size:14px;margin-top:8px}
.card button{margin-top:14px;padding:10px 22px;font-size:17px;font-weight:700;border:0;border-radius:8px;background:var(--ac);color:#1a1200;cursor:pointer}
#photo{position:absolute;right:10px;bottom:90px;width:200px;height:auto;border:3px solid #fff;border-radius:6px;display:none;box-shadow:0 4px 14px #000a;pointer-events:none;background:#000}
#photo.big{width:68%;left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%)}
#plist{list-style:none;padding:0;margin:12px 0;text-align:left;max-height:150px;overflow:auto}
#plist li{padding:5px 10px;border-bottom:1px solid #fff2}
html,body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,select{-webkit-user-select:text;user-select:text}
#wrap{touch-action:none}
#cover{display:flex;overflow:auto;align-items:flex-start;cursor:default}
.card{margin:auto}
.card h2.h{margin:0 0 8px;color:var(--ac)}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card .row.col{flex-direction:column;align-items:center}
.card button.big{font-size:22px;padding:14px 34px;min-width:230px}
.card button.sec{background:#3a3346;color:#f2ece4}
.card button:disabled{opacity:.5}
.logo{font-size:46px;letter-spacing:.05em;color:var(--ac);font-weight:900;line-height:1.05;text-shadow:0 3px 0 #7a5a00,0 7px 20px #000}
.credit{font-size:11px;color:#9a93a3;margin-top:18px;letter-spacing:.04em}
.srv{display:flex;justify-content:space-between;gap:10px;background:#0d0b10;border:1px solid #fff3;border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;text-align:left;font-size:15px}
.srv:hover{border-color:var(--ac)}
#tc{position:absolute;inset:0;pointer-events:none;display:none;z-index:3}
#tc>*{pointer-events:auto}
#joy{position:absolute;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:#fff1;border:2px solid #fff4;touch-action:none}
#joyk{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#ffcc4dcc;box-shadow:0 2px 8px #0008;pointer-events:none}
.tb{position:absolute;border-radius:50%;border:2px solid #fff6;background:#000a;color:#fff;font-size:24px;display:grid;place-items:center;padding:0;touch-action:none;cursor:pointer}
.tb.on{background:#ffcc4dcc;color:#1a1200}
#bPunch{right:20px;bottom:20px;width:80px;height:80px;font-size:36px}
#bJump{right:105px;bottom:37px;width:46px;height:46px;font-size:19px}
#bCrouch{right:39px;bottom:105px;width:42px;height:42px;font-size:19px}
#bRun{right:86px;bottom:86px;width:42px;height:42px}
.tb svg{width:62%;height:62%;pointer-events:none}
#bPhoto{right:133px;bottom:79px;width:42px;height:42px;font-size:19px}
#bBomb{right:156px;bottom:34px;width:44px;height:44px;font-size:22px}
#bView{right:77px;bottom:131px;width:42px;height:42px;font-size:19px}
#numin{position:absolute;left:0;top:0;width:40px;height:40px;opacity:0;font-size:16px;border:0;padding:0;margin:0;background:transparent;caret-color:transparent;pointer-events:none}
body.mob.kb #input{bottom:auto;top:62px}
#rot{position:fixed;inset:0;z-index:50;background:#0d0b10;display:none;place-items:center;text-align:center;font-size:20px;padding:30px;line-height:1.4}
@media (orientation:portrait){body.mob #rot{display:grid}}
body.mob #stats{bottom:auto;top:64px;left:12px;font-size:12px}
body.mob #mini{left:auto;right:10px;top:8px;bottom:auto;width:84px;height:84px}
body.mob #score .st{font-size:11px;margin-bottom:2px}
body.mob #score .sb b{font-size:25px;line-height:34px;height:34px}
body.mob #input{pointer-events:auto;bottom:10px;gap:6px}

#lp{position:absolute;left:10px;top:10px;z-index:3;width:min(250px,42%);display:none;background:#1b1722ee;border:1px solid #fff3;border-radius:12px;padding:12px;box-sizing:border-box;font-size:14px;max-height:calc(100% - 20px);overflow:auto;text-align:center}
#lp h2{margin:0 0 4px;font-size:18px;color:var(--ac)}
#lp .code{font:400 28px BebasKai,ui-monospace,monospace;letter-spacing:.2em;color:var(--ac)}

#lp li{padding:4px 6px;border-bottom:1px solid #fff2}

#lp button.sec{background:#3a3346;color:#f2ece4}

#wd{position:absolute;inset:0;z-index:8;display:none;gap:2.5%;padding:2.2% 3%;box-sizing:border-box;background:radial-gradient(ellipse at 30% 40%,#2a2233fa,#0d0b10fd);color:var(--fg);touch-action:manipulation}
#wd.on{display:flex}
#wd .wdm{flex:0 0 38%;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
#wd .frame{flex:1;min-height:0;aspect-ratio:300/440;max-width:100%;position:relative;border-radius:14px 14px 6px 6px;padding:7px;background:linear-gradient(135deg,#f6dc8a,#b98a2a 45%,#f2d27a 70%,#8d661a);box-shadow:0 8px 30px #000a,inset 0 0 0 2px #fff6}
#wd .glass{position:relative;width:100%;height:100%;border-radius:9px;overflow:hidden;background:linear-gradient(160deg,#4a5d70,#1d2733 55%,#2f3f50);box-shadow:inset 0 0 22px #000b}
#wd .glass:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,#fff0 30%,#ffffff26 38%,#fff0 46%,#fff0 62%,#ffffff18 66%,#fff0 72%)}
#wdc{width:100%;height:100%;display:block;cursor:ew-resize;touch-action:none}
#wd .wdr{display:flex;gap:6px;align-items:center}
#wd button{font:700 13px system-ui,sans-serif;border:0;border-radius:8px;background:#3a3346;color:#f2ece4;padding:7px 11px;cursor:pointer}
#wd button.on{background:var(--ac);color:#1a1200}
#wd label{font-size:11px;color:#aaa;cursor:pointer}
#wd .wdp{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}

#wdt{display:flex;gap:5px;flex-wrap:wrap}#wdt button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:20px;padding:5px 9px;min-width:58px}#wdt button span{font-size:10px;font-weight:600}
#wdo{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;align-content:start;touch-action:pan-y;padding:2px}
#wdo .chip{display:flex;align-items:center;gap:7px;text-align:left;background:#251f2e;border:2px solid transparent;font-size:12px}
#wdo .chip.on{border-color:var(--ac);background:#3a3030;color:var(--fg)}
#wdo .chip i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid #fff5}
#wd .wda{display:flex;gap:6px;flex-wrap:wrap}#wd .wda #wdok{margin-left:auto;background:var(--ac);color:#1a1200}
body.mob #wd{padding:1.5% 2%}body.mob #wd h3{font-size:15px}body.mob #wdt button{min-width:44px;font-size:16px;padding:3px 6px}body.mob #wdo{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}body.mob #wd button{font-size:11px;padding:5px 8px}

/* ---------- NAIPE: carta para cambiar de numero (carga 2 min) ---------- */
#naipe{right:12px;bottom:14px;width:70px;height:70px;z-index:4;display:none}
body.mob #naipe{right:auto;left:152px;bottom:44px;width:62px;height:62px}
body.mob #naipe.ready{pointer-events:auto;cursor:pointer}
#naipe svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
#naipe .nt{fill:none;stroke:#ffb62e;stroke-width:3;opacity:.5}
#naipe .np{fill:none;stroke:#ffb62e;stroke-width:3;stroke-linecap:round;opacity:1}
#naipe img{position:absolute;left:50%;top:50%;width:40.96px;height:40.96px;margin:-20.48px 0 0 -20.48px;opacity:.5;image-rendering:auto}
#naipe.ready img{opacity:1}
#naipe.ready .nt{opacity:1}
#naipe.flash img{animation:naipeFlash .9s ease-out}
#naipe.flash svg{animation:naipeRing .9s ease-out}
@keyframes naipeFlash{0%{filter:brightness(1);transform:scale(1)}25%{filter:brightness(2.4) drop-shadow(0 0 14px #ffd24d);transform:scale(1.22)}60%{filter:brightness(1.5) drop-shadow(0 0 8px #ffb62e);transform:scale(1.06)}100%{filter:brightness(1);transform:scale(1)}}
@keyframes naipeRing{0%,100%{filter:none}25%{filter:drop-shadow(0 0 10px #ffd24d)}}
</style></head><body>

function renderCard(winner){const c=$('card'),l3=phase==='lobby'&&LOBBY3D();$('cover').style.display=l3?'none':'flex';$('lp').style.display=l3?'block':'none';if(l3){renderLobbyPanel();return}
 const B=(id,t,cls)=>'<button id="'+id+'" class="'+(cls||'')+'">'+t+'</button>',LOGO='<div class="logo">ENTRE<br>AMIGOS</div>',CRED='<div class="credit">Diseñado by DENIS MOLINA</div>';
 if(phase==='device'){c.innerHTML=LOGO+'<p style="margin-top:16px"><b>¿Desde dónde jugás?</b></p><div class="row col">'+B('dpc','💻 PC','big')+B('dmo','📱 Celular','big')+'</div>'+CRED;
  $('dpc').onclick=()=>{setMob(false);go('splash')};$('dmo').onclick=()=>{setMob(true);go('splash')};return}
 if(phase==='splash'){c.innerHTML=LOGO+'<div style="margin-top:22px">'+B('play','JUGAR','big')+'</div>'+CRED;$('play').onclick=()=>go('mode');return}
 if(phase==='mode'){c.innerHTML='<h2 class="h">¿Cómo querés jugar?</h2><div class="row col">'+B('msrv','🌐 Servidor online (con amigos)','big')+B('mbot','🤖 Jugar con bots','big')+B('mbk','Atrás','sec')+'</div>';
  $('msrv').onclick=()=>{MODE='server';go('srv')};$('mbot').onclick=()=>{MODE='bots';go('name')};$('mbk').onclick=()=>go('splash');return}
 if(phase==='srv'){const n=NOTE;NOTE='';c.innerHTML='<h2 class="h">Servidor online</h2><p>Los jugadores de PC y de celular pueden entrar al mismo servidor.</p><div id="err">'+esc(n)+'</div><div class="row col">'+B('scr','➕ Crear servidor','big')+B('sjn','🔑 Unirme con código','big')+B('sls','📋 Ver servidores disponibles','big')+B('sbk','Atrás','sec')+'</div>';
  $('scr').onclick=()=>{CODE_MODE='create';pendSrv=null;go('code')};$('sjn').onclick=()=>{CODE_MODE='join';pendSrv=null;go('code')};$('sls').onclick=()=>go('list');$('sbk').onclick=()=>go('mode');return}
 if(phase==='list'){c.innerHTML='<h2 class="h">Servidores disponibles</h2><div id="sl" style="min-height:60px"><p>Buscando…</p></div><div class="row">'+B('lrf','🔄 Actualizar')+B('lbk','Atrás','sec')+'</div>';
  const load=()=>regList().then(a=>{if(phase!=='list')return;const sl=$('sl');
   if(a===null){sl.innerHTML='<p>La lista de servidores no está activada en esta versión. Pedile el código de 4 dígitos a tu amigo y usá «Unirme con código».</p>';return}
   if(!a.length){sl.innerHTML='<p>No hay servidores abiertos ahora. Creá uno vos.</p>';return}
   sl.innerHTML=a.map((s,i)=>'<div class="srv" data-i="'+i+'"><span>🏠 Sala de '+esc(String(s.name).slice(0,14))+'</span><span>'+(s.n|0)+'/'+MAXP+(s.play?' · jugando':'')+'</span></div>').join('');
   sl.querySelectorAll('.srv').forEach(el=>el.onclick=()=>{pendSrv=a[+el.dataset.i];CODE_MODE='join';go('code');if(/^\d{4}$/.test(String(pendSrv.code||''))){$('cd').value=pendSrv.code;$('cok').click()}})});
  $('lrf').onclick=()=>{$('sl').innerHTML='<p>Buscando…</p>';load()};$('lbk').onclick=()=>go('srv');load();return}
 if(phase==='code'){const cr=CODE_MODE==='create';
  c.innerHTML='<h2 class="h">'+(cr?'Crear servidor':'Unirme a un servidor')+'</h2><p>'+(cr?'Elegí un código de 4 dígitos. Pasáselo a tus amigos para que entren.':(pendSrv?'Sala de <b>'+esc(String(pendSrv.name))+'</b>. ':'')+'Ingresá el código de 4 dígitos del servidor.')+'</p><input type="text" id="cd" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" value="'+(cr?newCode():'')+'" autocomplete="off" style="font:400 38px BebasKai,ui-monospace,monospace;letter-spacing:.3em;width:60%"><div id="err"></div><div class="row">'+B('cok',cr?'Crear':'Unirme')+B('cbk','Atrás','sec')+'</div>';
  const cd=$('cd'),err=$('err');cd.oninput=()=>{cd.value=cd.value.replace(/\D/g,'')};
  const ok=()=>{const code=cd.value;if(!/^\d{4}$/.test(code)){err.textContent='El código debe tener 4 dígitos';cd.focus();return}
   const tok=++connTok;$('cok').disabled=true;err.style.color='#ddd';err.textContent='Conectando…';
   (CODE_MODE==='create'?netCreate(code):netJoin(code)).then(r=>{if(tok!==connTok||phase!=='code'){try{r.leave()}catch{}return}bindRoom(r);SRVCODE=code;go('name')}).catch(m=>{if(tok!==connTok||phase!=='code')return;err.style.color='';err.textContent=String(m);$('cok').disabled=false})};
  $('cok').onclick=ok;cd.onkeydown=e=>{if(e.key==='Enter')ok()};$('cbk').onclick=()=>{connTok++;go(pendSrv?'list':'srv')};if(!MOB)cd.focus();return}
 if(phase==='name'){c.innerHTML='<h2 class="h">'+(SRVCODE?'Servidor '+SRVCODE:'Modo bots')+'</h2><p>Todos llevan un cartelito de 4 dígitos en la frente (el tuyo no lo ves). Leé el de otro y escribilo: el primero que acierta lo elimina. Gana quien llegue a '+GOAL+' eliminaciones.</p><label for="ch" style="display:block;font-weight:700;margin-bottom:6px">¿Qué personaje sos?</label><select id="ch"><option value="">Elegí tu personaje…</option>'+FACES.map(f=>'<option value="'+f+'">'+f+'</option>').join('')+'</select><br><img id="chimg" alt=""><input type="text" id="nm" maxlength="14" placeholder="Tu nombre" autocomplete="off" style="margin-top:12px"><div id="err"></div><div class="row">'+B('go','Entrar')+B('nbk','Atrás','sec')+'</div>';
  const nm=$('nm'),ch=$('ch'),im=$('chimg'),cap=v=>v[0]+v.slice(1).toLowerCase(),
  gon=()=>{refreshChars();if(!ch.value){$('err').textContent='Elegí tu personaje primero';ch.focus();return}const v=nm.value.trim();if(!v){$('err').textContent='Escribí tu nombre';nm.focus();return}P.name=v;P.pick=P.face=ch.value;const lv=MODE==='server'&&room?[...lobby.values()].find(p=>p.playing):null;if(lv){startGame(lv.bots|0,lv);if(!MOB)try{cv.requestPointerLock()}catch{}}else{if(MODE==='server')joinLiveUntil=performance.now()+3000;enterLobby()}};
  ch.onblur=refreshChars;ch.onchange=()=>{$('err').textContent='';if(ch.value){im.onload=()=>im.style.display='block';im.onerror=()=>im.style.display='none';im.src='fotos/'+encodeURIComponent(ch.value)+'1.png';if(!nm.value.trim()||nm.value===nm.dataset.auto)nm.value=nm.dataset.auto=cap(ch.value)}else im.style.display='none'};
  $('go').onclick=gon;nm.onkeydown=e=>{if(e.key==='Enter')gon()};
  $('nbk').onclick=()=>{if(MODE==='server'){leaveRoom();SRVCODE=null;go('srv')}else go('mode')};refreshChars();return}
 if(phase==='lobby'){const help=MOB?'Joystick izquierdo: moverte · arrastrá en la pantalla: girar<br>👊 piña · ⬆ saltar · 🤫 modo sigiloso (gatear sin ruido) · 🔢 teclado para escribir el cartelito<br>📷 foto (si tenés la cámara)':'W A S D mover · mouse o ← → girar · 0–9 escribir · Backspace borrar<br>Espacio saltar (¡podés subirte a los sillones!) · C agacharse · Ctrl sigilo (gateás despacio y sin ruido; otra vez para levantarte) · Shift correr<br>Q o clic: piña 👊 (deja ciego 5 s) · F foto · V ver foto';
  c.innerHTML='<h2 class="h" style="font-size:22px">Sala de espera</h2>'+(SRVCODE?'<p style="margin:0">Servidor · código <b style="color:#ffcc4d;font:400 30px BebasKai,ui-monospace,monospace;letter-spacing:.2em">'+SRVCODE+'</b></p>':'<p style="margin:0">Modo bots (solo)</p>')+'<ul id="plist"></ul><label>¿Cuántos bots querés? <input type="number" id="bt" min="0" value="'+useBots+'" style="width:64px;padding:6px;border-radius:6px;border:1px solid #fff4;background:#0d0b10;color:inherit;text-align:center"></label><br><small id="bmax" style="color:#aaa"></small><div class="row">'+B('st','')+B('lv','Salir','sec')+'</div><p style="font-size:13px;color:#aaa">'+help+'</p>';
  $('bt').onchange=e=>{useBots=Math.max(0,Math.min(maxBots(),parseInt(e.target.value)||0));e.target.value=useBots};
  $('st').onclick=doStart;
  $('lv').onclick=leaveToMenu;
  drawLobby();return}
 if(phase==='over'){const o=OVER||{rows:[],win:winner};c.innerHTML='<h2 class="h">🏆 ¡Ganó <span id="wn"></span>!</h2><table class="sc"><tr><th>#</th><th>Jugador</th><th>Elim.</th><th>Victorias</th></tr>'+o.rows.map((r,i)=>'<tr class="'+(r.me?'me':'')+'"><td>'+(i+1)+'</td><td>'+(r.n===o.win?'🏆 ':'')+esc(r.n)+'</td><td>'+r.k+'</td><td>'+(WINS[r.n]||0)+'</td></tr>').join('')+'</table>'+B('bk','Volver a la sala');$('wn').textContent=o.win||winner;$('bk').onclick=enterLobby}}
var SRVCODE=null;
$('fs').onmousedown=e=>e.preventDefault();$('fs').onclick=toggleFS;
renderCard();
</script></body></html>
